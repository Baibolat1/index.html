<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Versailles Palace | Taraz</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --surface-border: rgba(255, 255, 255, 0.08);
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #71717a;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px 12px 32px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Hero Header */
        .hero {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius);
            padding: 32px 20px 24px;
            text-align: center;
            position: relative;
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .brand-loc {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Halls Tag Selector */
        .halls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .hall-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
        }

        .hall-chip .cap {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .hall-chip .lbl {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Card Section */
        .card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Form Controls */
        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input, .select {
            width: 100%;
            background: #18181b;
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            appearance: none;
            transition: border-color 0.2s;
        }

        .input:focus, .select:focus {
            border-color: var(--gold);
        }

        /* Total Output */
        .calc-result {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            margin-top: 20px;
        }

        .calc-result .val-lbl {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .calc-result .val-amount {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            margin-top: 4px;
        }

        /* CTA Button */
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: var(--gold);
            color: #000;
            font-weight: 700;
            font-size: 15px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 16px;
            transition: opacity 0.2s;
        }

        .btn-action:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Header -->
    <div class="hero">
        <div class="brand-subtitle">Ресторанный Комплекс</div>
        <h1 class="brand-title">Versailles Palace</h1>
        <p class="brand-loc">г. Тараз</p>

        <div class="halls-grid">
            <div class="hall-chip">
                <div class="cap">400</div>
                <div class="lbl">Главный зал</div>
            </div>
            <div class="hall-chip">
                <div class="cap">160</div>
                <div class="lbl">Мини зал</div>
            </div>
            <div class="hall-chip">
                <div class="cap">60</div>
                <div class="lbl">Банкетный</div>
            </div>
        </div>
    </div>

    <!-- Calculator Card -->
    <div class="card">
        <div class="section-title">Онлайн-расчет торжества</div>

        <div class="field">
            <label>Выбор зала</label>
            <select class="select" id="hall" onchange="calc()">
                <option value="Большой зал (до 400 мест)">Главный зал — 400 персон</option>
                <option value="Мини зал (до 160 мест)">Мини зал — 160 персон</option>
                <option value="Малый зал (до 60 мест)">Банкетный зал — 60 персон</option>
            </select>
        </div>

        <div class="field">
            <label>Дата мероприятия</label>
            <input type="date" class="input" id="date" onchange="calc()">
        </div>

        <div class="field">
            <label>Количество гостей</label>
            <input type="number" class="input" id="guests" value="150" min="10" oninput="calc()">
        </div>

        <div class="field">
            <label>Пакет меню (на персону)</label>
            <select class="select" id="menu" onchange="calc()">
                <option value="10000">Стандарт — 10 000 ₸</option>
                <option value="14000" selected>Премиум — 14 000 ₸</option>
                <option value="18000">Versailles VIP — 18 000 ₸</option>
            </select>
        </div>

        <div class="calc-result">
            <div class="val-lbl">Ориентировочный бюджет</div>
            <div class="val-amount" id="total">2 100 000 ₸</div>
        </div>

        <a href="#" id="wa" target="_blank" class="btn-action">
            Забронировать в WhatsApp
        </a>
    </div>
</div>

<script>
    function calc() {
        const guests = parseInt(document.getElementById('guests').value) || 0;
        const menu = parseInt(document.getElementById('menu').value) || 0;
        const hall = document.getElementById('hall').value;
        const date = document.getElementById('date').value;
        const sum = guests * menu;

        document.getElementById('total').innerText = sum.toLocaleString('ru-RU') + ' ₸';

        const phone = '77000000000'; // Укажешь номер управляющего
        const msg = encodeURIComponent(`Здравствуйте! Интересует бронирование Versailles Palace.\n\n` +
            `• Зал: ${hall}\n` +
            `• Дата: ${date || 'Не определена'}\n` +
            `• Гостей: ${guests}\n` +
            `• Выбранный пакет: ${menu.toLocaleString('ru-RU')} ₸/чел\n` +
            `• Итоговая сумма: ${sum.toLocaleString('ru-RU')} ₸`);

        document.getElementById('wa').href = `https://wa.me/${phone}?text=${msg}`;
    }

    calc();
</script>

</body>
</html>
