<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банкетный Зал «Royal» | Тараз</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            --gold-glow: rgba(212, 175, 55, 0.25);
            --text-light: #F5F5F5;
            --text-muted: #A0A0A0;
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header */
        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px var(--gold-glow);
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gold-gradient);
        }

        .crown-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Section Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: var(--gold-primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
        }

        /* Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .gallery-item {
            width: 100%;
            height: 110px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            border-color: var(--gold-primary);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px var(--gold-glow);
        }

        /* Total Box */
        .total-box {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--gold-primary);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-top: 20px;
        }

        .total-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .total-amount {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        /* Button */
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #25D366;
            color: #000;
            font-weight: 600;
            font-size: 15px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 16px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-whatsapp:hover {
            background: #20ba5a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header-card">
        <div class="crown-icon">👑</div>
        <h1 class="title">Банкетный Зал «Royal»</h1>
        <p class="subtitle">г. Тараз • Торжества & Мероприятия Высокого Уровня</p>
    </div>

    <!-- Gallery -->
    <div class="card">
        <h2 class="card-title">📸 Интерьер и Атмосфера</h2>
        <div class="gallery-grid">
            <img src="https://images.unsplash.com/photo-1519167758481-83f550bb49b3?w=500" class="gallery-item" alt="Зал">
            <img src="https://images.unsplash.com/photo-1555244162-803834f70033?w=500" class="gallery-item" alt="Сервировка">
            <img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=500" class="gallery-item" alt="Декор">
            <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=500" class="gallery-item" alt="Банкет">
        </div>
    </div>

    <!-- Calculator -->
    <div class="card">
        <h2 class="card-title">🧮 Расчет Стоимости</h2>
        
        <div class="form-group">
            <label for="event-date">Дата мероприятия:</label>
            <input type="date" id="event-date">
        </div>

        <div class="form-group">
            <label for="guests">Количество гостей:</label>
            <input type="number" id="guests" value="100" min="1" oninput="calculateTotal()">
        </div>

        <div class="form-group">
            <label for="menu">Пакет меню (на персону):</label>
            <select id="menu" onchange="calculateTotal()">
                <option value="8000">Премиум — 8 000 ₸</option>
                <option value="12000">Luxe Royal — 12 000 ₸</option>
                <option value="15000">VIP Exclusive — 15 000 ₸</option>
            </select>
        </div>

        <div class="total-box">
            <div class="total-label">Примерная стоимость:</div>
            <div class="total-amount" id="total-price">800 000 ₸</div>
        </div>

        <a href="#" id="whatsapp-link" target="_blank" class="btn-whatsapp">
            💬 Забронировать через WhatsApp
        </a>
    </div>
</div>

<script>
    function calculateTotal() {
        const guests = parseInt(document.getElementById('guests').value) || 0;
        const menuPrice = parseInt(document.getElementById('menu').value) || 0;
        const date = document.getElementById('event-date').value;
        
        const total = guests * menuPrice;
        
        document.getElementById('total-price').innerText = total.toLocaleString('ru-RU') + ' ₸';

        const phone = '77000000000'; // Замени на свой номер WhatsApp
        const message = encodeURIComponent(`Здравствуйте! Хочу забронировать банкетный зал «Royal».\nДата: ${date || 'Не выбрана'}\nКоличество гостей: ${guests}\nВыбранный пакет: ${menuPrice.toLocaleString()} ₸\nОриентировочная сумма: ${total.toLocaleString()} ₸`);
        
        document.getElementById('whatsapp-link').href = `https://wa.me/${phone}?text=${message}`;
    }

    document.getElementById('event-date').addEventListener('change', calculateTotal);
    calculateTotal();
</script>

</body>
</html>
